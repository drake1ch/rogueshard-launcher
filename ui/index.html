<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Rogue Shard Launcher</title>
<!-- The launcher's window (mockup.html made real): the wiki's colours and font. The Rust side
     calls rs.update({...}) with the state; buttons send strings through window.ipc.postMessage. -->
<style>
:root {
  --bg: #0e1022; --panel: #171a33; --panel-2: #1d2140; --panel-3: #232848; --line: #2b3057;
  --text: #d7dbf0; --dim: #8b91b4; --link: #7fa9ff; --good: #74c274; --bad: #d06a6a; --unique: #a15cd8;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI", Roboto, system-ui, sans-serif;
  overflow: hidden; user-select: none; }
a { color: var(--link); text-decoration: none; cursor: pointer; }
a:hover { text-decoration: underline; }
.body { display: grid; grid-template-columns: 290px 1fr; height: 100%; }
.side { background: var(--panel); border-right: 1px solid var(--line); padding: 22px 22px 18px; display: flex; flex-direction: column; }
.side img { width: 140px; display: block; margin: 0 auto 4px; }
.side h1 { text-align: center; font-size: 18px; letter-spacing: 4px; text-transform: uppercase; margin: 4px 0 2px; }
.side .ver { text-align: center; color: var(--dim); font-size: 12px; margin-bottom: 20px; }
.play { display: block; width: 100%; padding: 14px 0; border: 1px solid #5a7a3a; border-radius: 6px; cursor: pointer;
  background: linear-gradient(#3c5a2a, #2a4220); color: #eaffd8; font: 600 18px "Segoe UI", sans-serif; letter-spacing: 3px; text-transform: uppercase; }
.play:hover { filter: brightness(1.12); }
.play[disabled] { background: var(--panel-3); border-color: var(--line); color: var(--dim); cursor: default; filter: none; }
.status { margin-top: 12px; font-size: 12px; color: var(--dim); min-height: 36px; }
.status b { color: var(--good); font-weight: 600; }
.status.err b { color: var(--bad); }
.bar { height: 6px; background: var(--panel-3); border-radius: 3px; overflow: hidden; margin-top: 8px; display: none; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--link), var(--unique)); transition: width .4s; }
.busy .bar { display: block; }
.lang { display: flex; justify-content: center; margin-top: 14px; }
.lang button { background: none; border: 1px solid var(--line); color: var(--dim); font: 600 11px "Segoe UI", sans-serif; padding: 2px 10px; cursor: pointer; }
.lang button:first-child { border-radius: 4px 0 0 4px; } .lang button:last-child { border-radius: 0 4px 4px 0; border-left: 0; }
.lang button.on { background: var(--panel-3); color: var(--text); }
.side .links { margin-top: auto; display: grid; gap: 6px; font-size: 13px; }
.main { padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.sec h2 { margin: 0 0 8px; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--dim); font-weight: 600;
  display: flex; align-items: center; gap: 10px; }
.sec h2 .act { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 13px; }
.mods { border: 1px solid var(--line); border-radius: 6px; overflow-y: auto; max-height: 190px; }
.mods .empty { padding: 14px; color: var(--dim); text-align: center; background: var(--panel-2); }
.mod { display: grid; grid-template-columns: 18px 22px 1fr 52px 100px; align-items: center; gap: 10px; padding: 6px 12px;
  background: var(--panel-2); border-top: 1px solid var(--line); }
.mod.off .name, .mod.off .n { color: var(--gone, #6a6f8c); text-decoration: line-through; }
.mod .chk { width: 16px; height: 16px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel-3); cursor: pointer;
  display: flex; align-items: center; justify-content: center; color: #d7f7c0; font-size: 12px; line-height: 1; }
.mod .chk.on { background: #3c5a2a; border-color: #5a7a3a; }
.mod .mv { display: flex; gap: 4px; justify-content: center; }
.mod .mv button { width: 22px; height: 20px; padding: 0; background: var(--panel-3); color: var(--dim); border: 1px solid var(--line);
  border-radius: 3px; cursor: pointer; font-size: 10px; line-height: 1; }
.mod .mv button:hover:not([disabled]) { color: var(--text); border-color: var(--link); }
.mod .mv button[disabled] { opacity: .3; cursor: default; }
.locked .mod .chk, .locked .mod .mv button { pointer-events: none; opacity: .5; }
.mod:first-child { border-top: 0; }
.mod:nth-child(even) { background: var(--panel); }
.mod .n { color: var(--dim); text-align: right; }
.mod .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mod .st { font-size: 12px; text-align: right; }
.st.ok { color: var(--good); } .st.run { color: var(--link); } .st.wait { color: var(--dim); } .st.bad { color: var(--bad); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; font-size: 13px; }
.row { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; align-items: center; }
.row > span:first-child { color: var(--dim); white-space: nowrap; }
.row code { color: var(--text); font: 12px Consolas, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; max-width: 240px; }
.toggle { display: inline-block; width: 30px; height: 16px; border-radius: 8px; background: var(--panel-3); position: relative; cursor: pointer; flex: none; }
.toggle::after { content: ""; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--dim); }
.toggle.on { background: #3c5a2a; } .toggle.on::after { left: auto; right: 2px; background: #d7f7c0; }
.keys-head { display: flex; justify-content: space-between; margin: 6px 0 2px; padding-top: 6px; border-top: 1px solid var(--line); color: var(--dim); }
.keys-head a { font-size: 12px; }
.key { display: flex; justify-content: space-between; align-items: center; padding: 2px 0; }
.key span { color: var(--dim); }
.key .sp { display: flex; align-items: center; gap: 1px; }
.key .sp input { width: 46px; background: transparent; color: var(--text); border: 1px solid transparent; border-radius: 4px;
  padding: 1px 3px 1px 1px; font: 13px inherit; font-family: inherit; }
.key .sp input:hover { border-color: var(--line); }
.key .sp input:focus { outline: none; border-color: var(--link); background: var(--panel-3); }
.key .sp input.bad { border-color: var(--bad); color: var(--bad); }
.key button { min-width: 130px; background: var(--panel-3); color: var(--text); border: 1px solid var(--line); border-radius: 4px;
  padding: 1px 10px; font: 12px Consolas, monospace; cursor: pointer; }
.key button.wait { border-color: var(--link); color: var(--link); }
.key button.dup { border-color: var(--bad); color: var(--bad); }
.logsec { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.log { flex: 1; min-height: 70px; background: #0a0c1a; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px;
  font: 12px/1.5 Consolas, monospace; color: var(--dim); overflow-y: auto; user-select: text; white-space: pre-wrap; word-break: break-all; }
.log .w { color: #d8b45a; } .log .e { color: var(--bad); } .log .o { color: var(--good); }
</style>
</head>
<body>
<div class="body" id="root">
  <aside class="side">
    <img src="logo.png" alt="Rogue Shard">
    <h1>Rogue Shard</h1>
    <div class="ver" id="ver"></div>
    <button class="play" id="play"></button>
    <div class="bar"><i id="fill"></i></div>
    <div class="status" id="status"></div>
    <div class="lang"><button data-l="ru">RU</button><button data-l="en">EN</button></div>
    <div class="links">
      <a data-cmd="saves" data-t="saves"></a>
      <a data-cmd="wiki" data-t="wiki"></a>
      <a data-cmd="logs" data-t="report"></a>
    </div>
  </aside>
  <section class="main">
    <div class="sec">
      <h2><span data-t="mods"></span> <span id="modcount" style="color:var(--text)"></span><span class="act"><a data-cmd="mods" data-t="modsFolder"></a></span></h2>
      <div class="mods" id="mods"></div>
    </div>
    <div class="grid2">
      <div class="sec">
        <h2><span data-t="game"></span><span class="act"><a id="pickGame" data-t="pickGame"></a></span></h2>
        <div class="box">
          <div class="row"><span>Stoneshard</span><code id="gamedir"></code></div>
          <div class="row"><span data-t="source"></span><code id="vanilla"></code></div>
          <div class="row"><span data-t="built"></span><code id="built"></code></div>
        </div>
      </div>
      <div class="sec">
        <h2 data-t="settings"></h2>
        <div class="box">
          <div class="row"><span data-t="rebuild"></span><span class="toggle" id="rebuild"></span></div>
          <div class="row"><span data-t="autoMod"></span><span class="toggle" id="autoMod"></span></div>
          <div class="row"><span data-t="autoLauncher"></span><span class="toggle" id="autoLauncher"></span></div>
          <div class="keys-head"><span data-t="speedKeys"></span><a id="resetKeys" data-t="reset"></a></div>
          <div id="keys"></div>
        </div>
      </div>
    </div>
    <div class="sec logsec">
      <h2 data-t="log"></h2>
      <div class="log" id="log"></div>
    </div>
  </section>
</div>
<script>
const T = {
  ru: {
    ver: "лаунчер", play: "Играть", playBusy: "Патчинг...", playRunning: "Игра запущена",
    saves: "Сохранения", wiki: "Вики и патчноуты", report: "Сообщить об ошибке",
    mods: "Моды", modsFolder: "Открыть папку mods", noMods: "Папка mods пуста: запустится игра без модов",
    game: "Игра", source: "Исходный data.win", built: "Сборка с модами", notBuilt: "ещё не собрана", noGame: "не найдена",
    settings: "Настройки", rebuild: "Пересобирать при каждом запуске", speedKeys: "Клавиши ускорения", reset: "Сбросить",
    press: "Нажмите клавишу...", speedTip: "Скорость: от 0.25 до 100, Enter - сохранить", dup: "уже занято", log: "Журнал",
    sOff: "выключен", toggleTip: "Включить или выключить мод", upTip: "Загружать раньше", downTip: "Загружать позже",
    sOk: "готов", sNew: "новый", sDone: "применён", sRun: "патчинг...", sWait: "в очереди", sBad: "ошибка",
    ready: "<b>Сборка готова</b>", needBuild: "<b>Моды изменились:</b> при запуске data.win соберётся заново",
    noModsReady: "<b>Готово</b>", patching: "<b>Собираю data.win:</b> ", loading: "<b>Загружаю data.win...</b>",
    saving: "<b>Сохраняю data.win...</b>", running: "<b>Игра запущена</b>", closed: "<b>Игра закрыта</b>",
    failed: "<b>Мод не применился.</b> Подробности в журнале", noGameErr: "<b>Stoneshard не найдена.</b> Установите игру в Steam или укажите её папку: Игра, Указать папку", pickGame: "Указать папку", autoMod: "Обновлять мод автоматически", autoLauncher: "Обновлять лаунчер автоматически", updating: "<b>Проверяю обновления...</b>",
    crashed: "<b>Игра завершилась с ошибкой.</b> Отчёт: last_run.log",
  },
  en: {
    ver: "launcher", play: "Play", playBusy: "Patching...", playRunning: "Game running",
    saves: "Saves", wiki: "Wiki and patch notes", report: "Report a bug",
    mods: "Mods", modsFolder: "Open the mods folder", noMods: "The mods folder is empty: the game starts without mods",
    game: "Game", source: "Original data.win", built: "Modded build", notBuilt: "not built yet", noGame: "not found",
    settings: "Settings", rebuild: "Rebuild on every launch", speedKeys: "Speed hotkeys", reset: "Reset",
    press: "Press a key...", speedTip: "Speed: 0.25 to 100, Enter to save", dup: "already used", log: "Log",
    sOff: "off", toggleTip: "Switch the mod on or off", upTip: "Load earlier", downTip: "Load later",
    sOk: "ready", sNew: "new", sDone: "applied", sRun: "patching...", sWait: "queued", sBad: "error",
    ready: "<b>Build ready</b>", needBuild: "<b>Mods changed:</b> data.win will be rebuilt on launch",
    noModsReady: "<b>Ready</b>", patching: "<b>Building data.win:</b> ", loading: "<b>Loading data.win...</b>",
    saving: "<b>Saving data.win...</b>", running: "<b>Game running</b>", closed: "<b>Game closed</b>",
    failed: "<b>A mod failed.</b> See the log for details", noGameErr: "<b>Stoneshard not found.</b> Install the game through Steam or choose its folder: Game, Choose folder", pickGame: "Choose folder", autoMod: "Update the mod automatically", autoLauncher: "Update the launcher automatically", updating: "<b>Checking for updates...</b>",
    crashed: "<b>The game ended with an error.</b> Report: last_run.log",
  },
};
const SPEEDS = [1, 3, 5, 10, 20]; // the defaults, S.speeds holds the player's
const DEFAULT_KEYS = ["Ctrl+1", "Ctrl+2", "Ctrl+3", "Ctrl+4", "Ctrl+5"];
let S = { lang: "ru", mods: [], disabled: [], phase: "ready", current: "", progress: 0, gameDir: "", vanilla: "", built: "", fresh: false, rebuild: false, keys: DEFAULT_KEYS.slice(), speeds: SPEEDS.slice(), modStates: {} };
let waiting = -1;
const send = m => window.ipc.postMessage(m);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function keyName(e) {
  const c = e.code;
  if (/^Key[A-Z]$/.test(c)) return c.slice(3);
  if (/^Digit\d$/.test(c)) return c.slice(5);
  if (/^(F\d+|Numpad\d)$/.test(c)) return c;
  const map = { Space: "Space", Tab: "Tab", Backquote: "`", Minus: "-", Equal: "=", BracketLeft: "[", BracketRight: "]", Comma: ",",
    Period: ".", Slash: "/", Semicolon: ";", Quote: "'", Backslash: "Backslash", Insert: "Insert", Delete: "Delete", Home: "Home",
    End: "End", PageUp: "PageUp", PageDown: "PageDown", ArrowUp: "Up", ArrowDown: "Down", ArrowLeft: "Left", ArrowRight: "Right",
    NumpadAdd: "Numpad+", NumpadSubtract: "Numpad-", NumpadMultiply: "Numpad*", NumpadDivide: "Numpad/", Pause: "Pause", ScrollLock: "ScrollLock" };
  return map[c] || null;
}
function render() {
  const t = T[S.lang];
  document.documentElement.lang = S.lang;
  document.querySelectorAll("[data-t]").forEach(e => e.innerHTML = t[e.dataset.t]);
  document.getElementById("ver").textContent = S.launcherVersion ? t.ver + " " + S.launcherVersion : "";
  const on = S.mods.filter(m => !S.disabled.some(d => d.toLowerCase() === m.toLowerCase())).length;
  document.getElementById("modcount").textContent = on === S.mods.length ? S.mods.length : on + " / " + S.mods.length;
  const list = document.getElementById("mods");
  if (!S.mods.length) list.innerHTML = `<div class="empty">${t.noMods}</div>`;
  else list.innerHTML = S.mods.map((m, i) => {
    const off = S.disabled.some(d => d.toLowerCase() === m.toLowerCase());
    const st = S.modStates[m];
    const cls = off ? ["wait", t.sOff] : st === "done" ? ["ok", t.sDone] : st === "run" ? ["run", t.sRun] : st === "wait" ? ["wait", t.sWait] : st === "bad" ? ["bad", t.sBad]
      : S.fresh ? ["ok", t.sOk] : ["wait", t.sNew];
    return `<div class="mod${off ? " off" : ""}"><span class="chk${off ? "" : " on"}" data-toggle="${esc(m)}" title="${t.toggleTip}">${off ? "" : "&#10003;"}</span>`
      + `<span class="n">${i + 1}</span><span class="name">${esc(m)}</span>`
      + `<span class="mv"><button data-move="${esc(m)}" data-to="${i - 1}" ${i === 0 ? "disabled" : ""} title="${t.upTip}">&#9650;</button>`
      + `<button data-move="${esc(m)}" data-to="${i + 1}" ${i === S.mods.length - 1 ? "disabled" : ""} title="${t.downTip}">&#9660;</button></span>`
      + `<span class="st ${cls[0]}">${cls[1]}</span></div>`;
  }).join("");
  list.querySelectorAll("[data-toggle]").forEach(e => e.onclick = () => send("toggle:" + e.dataset.toggle));
  list.querySelectorAll("[data-move]").forEach(e => e.onclick = () => send("move:" + e.dataset.move + ":" + e.dataset.to));
  document.getElementById("gamedir").textContent = S.gameDir || t.noGame;
  document.getElementById("vanilla").textContent = S.vanilla || "-";
  document.getElementById("built").textContent = S.built || t.notBuilt;
  document.getElementById("rebuild").classList.toggle("on", S.rebuild);
  document.getElementById("autoMod").classList.toggle("on", S.autoMod);
  document.getElementById("autoLauncher").classList.toggle("on", S.autoLauncher);
  const busy = ["patching", "loading", "saving", "updating"].includes(S.phase);
  document.getElementById("root").classList.toggle("busy", busy);
  document.getElementById("root").classList.toggle("locked", busy || S.phase === "running");
  const p = document.getElementById("play");
  p.disabled = busy || S.phase === "running" || !S.gameDir;
  p.textContent = busy ? t.playBusy : S.phase === "running" ? t.playRunning : t.play;
  const s = document.getElementById("status");
  s.classList.toggle("err", ["failed", "noGame", "crashed"].includes(S.phase));
  s.innerHTML = !S.gameDir ? t.noGameErr
    : S.phase === "patching" ? t.patching + esc(S.current)
    : S.phase === "ready" ? (!S.mods.length ? t.noModsReady : S.fresh && !S.rebuild ? t.ready : t.needBuild)
    : S.phase === "noGame" ? t.noGameErr : t[S.phase] || "";
  document.getElementById("fill").style.width = Math.round(S.progress * 100) + "%";
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l === S.lang));
  renderKeys();
}
function parseSpeed(v) {
  const n = parseFloat(String(v).trim().replace(/^[xXхХ]+|[xXхХ]+$/g, "").replace(",", "."));
  return isFinite(n) && n >= 0.25 && n <= 100 ? Math.round(n * 100) / 100 : null;
}
function renderKeys() {
  const t = T[S.lang];
  if (document.activeElement && document.activeElement.matches("#keys input")) return; // the player is typing a speed
  const speeds = S.speeds || SPEEDS;
  document.getElementById("keys").innerHTML = speeds.map((sp, i) => {
    const dup = S.keys.findIndex((k, j) => j !== i && k === S.keys[i]) >= 0;
    const label = waiting === i ? t.press : esc(S.keys[i]) + (dup ? " (" + t.dup + ")" : "");
    return `<div class="key"><span class="sp">x<input data-s="${i}" value="${sp}" title="${t.speedTip}" maxlength="6"></span><button data-k="${i}" class="${waiting === i ? "wait" : dup ? "dup" : ""}">${label}</button></div>`;
  }).join("");
  document.querySelectorAll("#keys button").forEach(b => b.onclick = () => { waiting = +b.dataset.k; renderKeys(); });
  document.querySelectorAll("#keys input").forEach(e => {
    e.oninput = () => e.classList.toggle("bad", parseSpeed(e.value) === null);
    e.onkeydown = ev => { ev.stopPropagation(); if (ev.key === "Enter") e.blur(); if (ev.key === "Escape") { e.value = speeds[+e.dataset.s]; e.blur(); } };
    e.onblur = () => {
      const v = parseSpeed(e.value);
      if (v !== null) { S.speeds = speeds.slice(); S.speeds[+e.dataset.s] = v; send("speeds:" + S.speeds.join("|")); }
      setTimeout(renderKeys, 0);
    };
  });
}
function saveKeys() { send("keys:" + S.keys.join("|")); }
document.addEventListener("keydown", e => {
  if (waiting < 0) return;
  e.preventDefault();
  if (e.code === "Escape") { waiting = -1; renderKeys(); return; }
  if (["ControlLeft", "ControlRight", "ShiftLeft", "ShiftRight", "AltLeft", "AltRight", "MetaLeft", "MetaRight"].includes(e.code)) return;
  const k = keyName(e);
  if (!k) return;
  S.keys[waiting] = (e.ctrlKey ? "Ctrl+" : "") + (e.shiftKey ? "Shift+" : "") + (e.altKey ? "Alt+" : "") + k;
  waiting = -1;
  saveKeys();
  renderKeys();
});
document.getElementById("resetKeys").onclick = () => { S.keys = DEFAULT_KEYS.slice(); S.speeds = SPEEDS.slice(); waiting = -1; saveKeys(); send("speeds:" + S.speeds.join("|")); renderKeys(); };
document.getElementById("play").onclick = () => send("play");
document.getElementById("pickGame").onclick = () => send("pickgame");
document.getElementById("rebuild").onclick = () => send("rebuild:" + (S.rebuild ? 0 : 1));
document.getElementById("autoMod").onclick = () => send("automod:" + (S.autoMod ? 0 : 1));
document.getElementById("autoLauncher").onclick = () => send("autolauncher:" + (S.autoLauncher ? 0 : 1));
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => send("lang:" + b.dataset.l));
document.querySelectorAll("[data-cmd]").forEach(a => a.onclick = () => send("open:" + a.dataset.cmd));
document.addEventListener("contextmenu", e => e.preventDefault());
const LOG_MAX = 400;
window.rs = {
  update(st) { Object.assign(S, st); render(); },
  log(lines) {
    const box = document.getElementById("log");
    const atEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 4;
    for (const [cls, text] of lines) {
      const d = document.createElement("div");
      if (cls) d.className = cls;
      d.textContent = text;
      box.appendChild(d);
    }
    while (box.childNodes.length > LOG_MAX) box.removeChild(box.firstChild);
    if (atEnd) box.scrollTop = box.scrollHeight;
  },
  clearLog() { document.getElementById("log").innerHTML = ""; },
};
render();
send("ready");
// mods dropped into the folder show up without a restart
setInterval(() => { if (!["patching", "loading", "saving", "running"].includes(S.phase)) send("refresh"); }, 2000);
</script>
</body>
</html>
